# Yangi mijoz uchun shablon. Nusxalang, nomini o'zgartiring, agentlarni yozing.
# Core kodga tegish shart emas: yangi vertikal = yangi YAML.
#
# Qoidalar:
#  - tools[] ichidagi har nom runtime registry'da mavjud bo'lishi shart,
#    aks holda pack yuklanmaydi va xato qaysi tool ekanini aytadi.
#  - ladder faqat: human_led | human_assisted | autonomous
#  - har write tool (telegram.send, records.create, sheets.append, ...) tasdiq talab qiladi.
#  - deterministik /report, /memory, /record buyruqlari agent NOMI bo'yicha emas,
#    QOBILIYAT bo'yicha yo'naltiriladi: shu tool'ga ruxsati bor birinchi agent tanlanadi.
#  - suhbat (conversation): kiruvchi xabarga natija asosida javob. Faqat
#    conversation.enabled: true va triggers'da {type: message, source: <kanal>}
#    bo'lgan birinchi agent tanlanadi. Javobdagi 4+ xonali son (narx, telefon,
#    buyurtma raqami) lookup natijasida, shu suhbatning oldingi xabarlarida,
#    persona yoki fallback_text'da bo'lmasa, fallback_text yuboriladi va
#    operatorga uzatiladi (yillar va "1.5 mln"/"150 ming" kabi shakllar tushuniladi).
#    Chegaralar: max_steps 1..12, max_seconds 60..86400, history_turns 0..20,
#    fallback_text <= 1000 belgi (bo'sh bo'lsa core'ning standart matni).
name: template
language: uz
agents:
  - id: sales.responder
    name: "Javobchi (namuna, nusxalab o'zgartiring)"
    department: sales
    persona: prompts/responder.md
    tools: [telegram.send]
    ladder: human_led
    approval: { required_for: [telegram.send], approver_role: operator }
    triggers:
      - type: message
        source: telegram
    # Yoqish uchun enabled: true (va LLM agent_loop_enabled: true integrations'da).
    conversation:
      enabled: false
      max_steps: 3
      max_seconds: 120
      history_turns: 6
      fallback_text: ""
  - id: ops.assistant
    name: "Operatsion yordamchi (namuna)"
    department: operations
    tools: [reports.summary, records.create, records.list, memory.put, memory.search]
    ladder: human_assisted
branches:
  - id: main
    name: "Asosiy filial"
    address: "Toshkent"
    phone: "+998900000000"
