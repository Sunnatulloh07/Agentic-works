name: Hardening preview checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r api-python/requirements-offline.txt
      - run: python scripts/verify_manifest.py
      - run: python -m unittest discover -s runtime_tests -v
        working-directory: api-python
      - run: python scripts/demo_runtime.py
      - run: python -m unittest discover -s scripts -p "test_release_tools.py" -v
      - run: python -m unittest discover -s scripts -p "test_manifest.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/runner/test.js apps/ui/lib/session-client.test.mjs apps/ui/lib/oauth-client.test.mjs apps/ui/lib/google-data-client.test.mjs
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        working-directory: api-python
      - run: python -m pytest integration_tests -q
        working-directory: api-python
        env:
          ENV: test
          PIPELINE_MODE: platform
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run typecheck && npm run build
        working-directory: apps/ui
  ui_dependency_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: apps/ui
